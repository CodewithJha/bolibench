# DigitalOcean App Platform app spec: https://docs.digitalocean.com/products/app-platform/reference/app-spec/
# One container: the demo server plus, when the two secrets are set, a hosted example agent (live mode).
name: bolibench-demo
services:
  - name: web
    github:
      repo: CodewithJha/bolibench
      branch: master
      deploy_on_push: true
    source_dir: /
    dockerfile_path: Dockerfile
    http_port: 8080  # App Platform sets PORT to this value
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb  # smallest size; single instance only, matches the in-memory limits
    health_check:
      http_path: /health
    envs:
      # App Platform's X-Forwarded-For holds its ingress IP; the client IP is in do-connecting-ip
      - key: BOLIBENCH_CLIENT_IP_HEADER
        value: do-connecting-ip
        scope: RUN_TIME
      # live mode: an open-weight model on DigitalOcean serverless inference (OpenAI-compatible)
      - key: AGENT_BASE_URL
        value: https://inference.do-ai.run/v1
        scope: RUN_TIME
      # open-weight Gemma 4; verify tool calling with the probe in docs/deployment.md first,
      # and add AGENT_TOOL_MODE=json if the model returns no tool_calls
      - key: AGENT_MODEL
        value: gemma-4-31B-it
        scope: RUN_TIME
      - key: AGENT_API_KEY_ENV  # the name of the variable holding the key, not the key
        value: MODEL_ACCESS_KEY
        scope: RUN_TIME
      - key: BOLIBENCH_LIVE_DAILY_CAP
        value: "50"
        scope: RUN_TIME
      # Secrets are not committed. Add them in the control panel (web component > Environment Variables,
      # tick Encrypt), or uncomment in a local, uncommitted copy before `doctl apps create`:
      # - key: MODEL_ACCESS_KEY
      #   value: <model access key>
      #   type: SECRET
      #   scope: RUN_TIME
      # - key: BOLIBENCH_DEMO_TOKEN
      #   value: <at least 16 characters>
      #   type: SECRET
      #   scope: RUN_TIME
# domains:
#   - domain: bolibench.example.tech  # add only once the domain is registered; see docs/deployment.md
#     type: PRIMARY
