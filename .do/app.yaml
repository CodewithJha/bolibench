# DigitalOcean App Platform app spec: https://docs.digitalocean.com/products/app-platform/reference/app-spec/
# One container: the demo server plus, when the two secrets are set, a hosted example agent (live mode).
name: bolibench-demo
services:
  - name: web
    github:
      repo: CodewithJha/bolibench
      branch: master
      deploy_on_push: true
    source_dir: /
    dockerfile_path: Dockerfile
    http_port: 8080  # App Platform sets PORT to this value
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb  # smallest size; single instance only, matches the in-memory limits
    health_check:
      http_path: /health
    envs:
      # App Platform's X-Forwarded-For holds its ingress IP; the client IP is in do-connecting-ip
      - key: BOLIBENCH_CLIENT_IP_HEADER
        value: do-connecting-ip
        scope: RUN_TIME
      # live mode: an open-weight model on DigitalOcean serverless inference (OpenAI-compatible)
      - key: AGENT_BASE_URL
        value: https://inference.do-ai.run/v1
        scope: RUN_TIME
      # open-weight Gemma 4; DigitalOcean's model table does not list tool calling for it
      - key: AGENT_MODEL
        value: gemma-4-31B-it
        scope: RUN_TIME
      # prompt-based tool calls; try native only after the tool-calling probe in docs/deployment.md returns tool_calls
      - key: AGENT_TOOL_MODE
        value: json
        scope: RUN_TIME
      - key: AGENT_API_KEY_ENV  # the name of the variable holding the key, not the key
        value: MODEL_ACCESS_KEY
        scope: RUN_TIME
      # Alternative: Gemma 4 on Google's Gemini API, as on Render (render.yaml). Replace the AGENT_* values with
      #   AGENT_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai  AGENT_MODEL=gemma-4-31b-it
      #   AGENT_TOOL_MODE=native  AGENT_REASONING_EFFORT=minimal  AGENT_API_KEY_ENV=GEMINI_API_KEY
      # and add the secret GEMINI_API_KEY instead of MODEL_ACCESS_KEY.
      - key: BOLIBENCH_LIVE_DAILY_CAP
        value: "20"
        scope: RUN_TIME
      # runs are async (POST returns 202, the page polls), so they may outlast the proxy's request limit
      - key: BOLIBENCH_LIVE_TURN_TIMEOUT
        value: "240"
        scope: RUN_TIME
      - key: BOLIBENCH_LIVE_RUN_TIMEOUT
        value: "600"
        scope: RUN_TIME
      # Secrets are not committed. Add them in the control panel (web component > Environment Variables,
      # tick Encrypt), or uncomment in a local, uncommitted copy before `doctl apps create`:
      # - key: MODEL_ACCESS_KEY  # or GEMINI_API_KEY for the Gemini alternative
      #   value: <model access key>
      #   type: SECRET
      #   scope: RUN_TIME
      # - key: BOLIBENCH_DEMO_TOKEN
      #   value: <at least 16 characters>
      #   type: SECRET
      #   scope: RUN_TIME
# domains:
#   - domain: bolibench.example.tech  # add only once the domain is registered; see docs/deployment.md
#     type: PRIMARY
