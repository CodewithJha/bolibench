[project]
name = "bolibench"
version = "0.1.0"
description = "An open-source benchmark for evaluating conversational AI agents through task correctness, tool-call behavior, and state-transition verification."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
sentry = ["sentry-sdk>=2.64"]
mongo = ["pymongo>=4.7,<5"]
tiger = ["psycopg[binary]>=3.1,<4"]
temporal = ["temporalio>=1.34"]
all = ["bolibench[sentry,mongo,tiger,temporal]"]

[project.scripts]
bolibench = "bolibench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
